<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حفل تخرج مدارس العبير 1447هـ</title>
    <style>
        :root { --ice: #f8faff; --blue: #1a73e8; --gold: #f1c40f; --dark: #2c3e50; }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f4f8; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
        }
        
        header { 
            background: var(--ice); 
            padding: 10px 30px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid #d1e3ff; 
            height: 70px; 
            flex-shrink: 0; 
            box-sizing: border-box; 
        }
        
        .h-right { display: flex; align-items: center; gap: 15px; }
        .h-right img { width: 50px; }
        
        .datetime-container { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        #date { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 2px; }
        #clock { font-size: 1.1rem; font-weight: bold; color: var(--blue); }
        
        main { 
            flex: 1; 
            display: flex; 
            gap: 20px; 
            padding: 20px; 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        .v-container { flex: 2; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #d1e3ff; position: relative; }
        .s-container { flex: 1; background: #fff; border-radius: 12px; overflow-y: auto; padding: 15px; border: 1px solid #e1e8ed; box-sizing: border-box; }
        
        .step { background: #fff; padding: 15px; margin-bottom: 12px; border-radius: 10px; border-right: 5px solid #edf2f7; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .num { background: var(--blue); color: #fff; min-width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .step.active { border-right-color: var(--gold); background: #f7fbff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .step.active .num { background: var(--gold); color: var(--dark); }
        
        footer { 
            background: var(--ice); 
            padding: 0 30px; 
            display: flex; 
            justify-content: space-between; 
            border-top: 2px solid #d1e3ff; 
            font-size: 0.9rem; 
            height: 60px; 
            align-items: center; 
            flex-shrink: 0; 
            box-sizing: border-box; 
        }
        
        iframe { width: 100%; height: 100%; border: none; }
        .step-info { color: #1a73e8 !important; font-weight: 500; }

        #start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(44, 62, 80, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .start-btn { background: var(--gold); color: var(--dark); border:none; padding: 15px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.2s; }
        .start-btn:hover { transform: scale(1.05); }

        /* التعديل المحدث لظهور الهيدر بشكل ممتاز بالجوال */
        @media (max-width: 768px) {
            body { 
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100vw; height: 100vh;
                overflow: hidden !important; 
            }
            header { 
                position: fixed; top: 0; left: 0; width: 100%; height: 70px; 
                z-index: 100; /* رفع قيمة الطبقة ليظهر فوق الـ main */
                padding: 10px 15px; 
            }
            header b { font-size: 0.85rem; }
            #clock { font-size: 0.95rem; }
            #date { font-size: 0.75rem; }
            
            footer { 
                position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; 
                z-index: 100; /* رفع قيمة الطبقة للفوتر أيضاً لضمان ثباته */
                padding: 0 15px; font-size: 0.8rem; 
            }
            
            main { 
                position: absolute;
                top: 70px; 
                bottom: 50px; 
                left: 0; right: 0;
                width: 100%; height: auto;
                flex-direction: column; 
                gap: 10px; 
                padding: 10px; 
                overflow: hidden !important;
                z-index: 1; /* جعل محتوى العرض في الطبقة الخلفية بالنسبة للهيدر والفوتر */
            }
            
            .v-container { 
                flex: none; 
                width: 100%; 
                height: 40%; 
                max-height: 240px;
            }
            
            .s-container { 
                flex: 1; 
                width: 100%; 
                overflow-y: auto !important; 
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>

<div id="start-overlay">
    <img src="https://i.ibb.co/35mxMNVg/image.png" style="width: 100px; margin-bottom: 20px;">
    <h2>حفل تخرج مدارس العبير الأهلية 1447هـ</h2>
    <p style="color: #ddd; margin-bottom: 30px;">جاهز لبدء العرض المباشر والمزامنة</p>
    <button class="start-btn" onclick="initApp()">بدء عرض الحفل المباشر 🎬</button>
</div>

<header>
    <div class="h-right">
        <img src="https://i.ibb.co/35mxMNVg/image.png">
        <div><b style="display:block">مدارس العبير الأهلية</b><small style="color:var(--blue)">المرحلة الأولية - حفل 1447هـ</small></div>
    </div>
    <div class="datetime-container">
        <div id="date">--/--/----</div>
        <div id="clock">00:00:00</div>
    </div>
</header>
<main>
    <div class="v-container" id="player"></div>
    <div class="s-container" id="list"></div>
</main>
<footer>
    <div>برمجة وتصميم: <b>الأستاذ/ محمد أحمد كمال</b> <span style="color:#e67e22; margin-right:10px">📞 0532417399</span></div>
    <div style="font-weight:bold; color:var(--blue)">مصممة خصيصاً لأولية العبير</div>
</footer>
<script>
    const db = "https://alabeer1447-default-rtdb.firebaseio.com/haldat.json";
    let lastV = "";
    let isAppInitialized = false; 
    
    const defaultSteps = [
        {title: "المقدمة والقرآن الكريم", info: "إعداد: أ/ إبراهيم"}, {title: "كلمة وكيل المدرسة", info: "أ/ محمد بن عبد الله الزهراني"},
        {title: "النشيد الوطني", info: "طلاب المرحلة الأولية"}, {title: "نشيد بلادي منار الهدى", info: "أ/ عماد خميس"},
        {title: "مسرحية أهمية العلم", info: "أ/ عنتر السيد"}, {title: "نشيد أنا إنسان", info: "أ/ وليد جمعة"},
        {title: "صراع العلم والجهل", info: "أ/ أحمد رفعت"}, {title: "نشيد خير الأنام", info: "أ/ حسن علام"},
        {title: "قصيدة مدارس العبير", info: "أ/ محمود محسن"}, {title: "نشيد اللغة الإنجليزية", info: "أ/ محمود يحيى"},
        {title: "أوبريت يا أجمل المدارس", info: "أ/ محمد قدري"}, {title: "مسرحية احترام المعلم", info: "أ/ حماده العجواني"},
        {title: "نشيد أن تدخلني ربي الجنة", info: "د/ السيد جاد الله"}, {title: "الحساب الذهني", info: "أ/ أشرف عبد التواب"},
        {title: "دورة الماء في الطبيعة", info: "أ/ محمد حمدي"}, {title: "نشيد حان الرحيل", info: "أ/ أحمد الشربيني"},
        {title: "مسيرة التخرج", info: "طلاب الدفعة 34"},
        {title: "فقرة إضافية 1", info: "إرساء مجهودات الطلاب"},
        {title: "فقرة إضافية 2", info: "خاتمة وتكريم"}
    ];

    function render(steps, active) {
        const list = document.getElementById('list');
        list.innerHTML = "";
        steps.forEach((s, i) => {
            const id = i+1; const cls = id == active ? 'active' : '';
            const titleText = s.title || s.t || "";
            const infoText = s.info || s.p || "";
            list.innerHTML += `<div class="step ${cls}" id="s-${id}"><div class="num">${id}</div><div><h3 style="margin:0;font-size:1rem">${titleText}</h3><small class="step-info">${infoText}</small></div></div>`;
        });
        const el = document.getElementById('s-' + active);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function sync() {
        try {
            const r = await fetch(db); const d = await r.json();
            if(d) {
                let steps = d.steps || defaultSteps;
                let active = d.currentStep || 1;
                render(steps, active);
                
                let vid = d.videoID || "6h5WAoDM68g";
                if (vid !== lastV) {
                    lastV = vid;
                    if(isAppInitialized){
                        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    }
                }
            }
        } catch (e) { console.log("DB connection error, showing defaults."); }
    }

    function initApp() {
        isAppInitialized = true;
        document.getElementById('start-overlay').style.display = 'none';
        
        if(lastV) {
            document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${lastV}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
        sync();
    }

    render(defaultSteps, 1);
    
    setInterval(() => { 
        const now = new Date();
        document.getElementById('clock').innerHTML = now.toLocaleTimeString('ar-SA');
        document.getElementById('date').innerHTML = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);
    
    setInterval(sync, 5000); 
    sync();
</script>
</body>
</html>
