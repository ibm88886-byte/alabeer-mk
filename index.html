
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل تخرج مدارس العبير 1447هـ</title>
    <style>
        :root { --ice: #f8faff; --blue: #1a73e8; --gold: #f1c40f; --dark: #2c3e50; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f4f8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--ice); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #d1e3ff; height: 70px; flex-shrink: 0; }
        .h-right { display: flex; align-items: center; gap: 10px; }
        .h-right img { width: 45px; }
        main { flex: 1; display: flex; gap: 15px; padding: 15px; overflow: hidden; }
        
        /* تصميم كرت البث البديل والمضمون */
        .v-container { flex: 2; background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #d1e3ff; text-align: center; padding: 20px; color: white; box-sizing: border-box; }
        .live-btn { background: #ff0000; color: white; border: none; padding: 18px 40px; border-radius: 35px; font-size: 1.4rem; font-weight: bold; cursor: pointer; text-decoration: none; box-shadow: 0 8px 25px rgba(255,0,0,0.4); transition: 0.3s; animation: pulse 1.5s infinite; display: inline-block; margin-top: 15px; }
        .live-btn:hover { background: #cc0000; transform: scale(1.05); }
        
        .s-container { flex: 1; background: #fff; border-radius: 12px; overflow-y: auto; padding: 12px; border: 1px solid #e1e8ed; }
        .step { background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 10px; border-right: 5px solid #edf2f7; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .num { background: var(--blue); color: #fff; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
        .step.active { border-right-color: var(--gold); background: #f7fbff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .step.active .num { background: var(--gold); color: var(--dark); }
        
        footer { background: var(--ice); padding: 0 15px; display: flex; justify-content: space-between; border-top: 2px solid #d1e3ff; font-size: 0.8rem; height: 50px; align-items: center; flex-shrink: 0; }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        @media (max-width: 768px) {
            main { flex-direction: column; overflow-y: auto; }
            .v-container { flex: none; height: 250px; }
            .s-container { flex: 1; overflow-y: auto; }
            header { padding: 5px 10px; }
            header b { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="h-right">
        <img src="https://i.ibb.co/vvDmQbkx/logo.png">
        <div><b style="display:block">مدارس العبير الأهلية</b><small style="color:var(--blue)">المرحلة الأولية - حفل 1447هـ</small></div>
    </div>
    <div style="font-family: Arial, sans-serif; text-align: center;">
        <div id="date" style="color: blue; font-size: 14px; font-weight: bold;"></div>
        <div id="time" style="color: black; font-size: 16px; font-weight: bold;"></div>
    </div>
</header>

<main>
    <!-- شاشة البث البديلة والقوية -->
    <div class="v-container">
        <img src="https://i.ibb.co/vvDmQbkx/logo.png" style="width: 60px; margin-bottom: 10px; opacity: 0.8;">
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--gold);">الحفل قائم الآن بث مباشر 🔴</h2>
        <p style="margin: 5px 0 15px 0; font-size: 0.9rem; color: #bbb;">اضغط على الزر أدناه للانتقال الفوري لشاشة العرض الحي بجودة عالية</p>
        <a id="liveLink" href="https://youtube.com" target="_blank" class="live-btn">شاهد البث المباشر الآن 📺</a>
    </div>

    <div class="s-container" id="list"></div>
</main>

<footer>
    <div>تطوير: <b>أ/ محمد كمال</b> <span style="color:#e67e22; margin-right:5px">📞 0532417399</span></div>
    <div style="font-weight:bold; color:var(--blue)">أولية العبير</div>
</footer>

<script>
    const db = "https://alabeer1447-default-rtdb.firebaseio.com/haldat.json";
    
    const defaultSteps = [
        {title: "المقدمة والقرآن الكريم", info: "إعداد: أ/ إبراهيم"}, {title: "كلمة وكيل المدرسة", info: "أ/ محمد بن عبد الله الزهراني"},
        {title: "النشيد الوطني", info: "طلاب المرحلة الأولية"}, {title: "نشيد بلادي منار الهدى", info: "أ/ عماد خميس"},
        {title: "مسرحية أهمية العلم", info: "أ/ عنتر السيد"}, {title: "نشيد أنا إنسان", info: "أ/ وليد جمعة"},
        {title: "صراع العلم والجهل", info: "أ/ أحمد رفعت"}, {title: "نشيد خير الأنام", info: "أ/ حسن علام"},
        {title: "قصيدة مدارس العبير", info: "أ/ محمود محسن"}, {title: "نشيد اللغة الإنجليزية", info: "أ/ محمود يحيى"},
        {title: "أوبريت يا أجمل المدارس", info: "أ/ محمد قدري"}, {title: "مسرحية احترام المعلم", info: "أ/ حماده العجواني"},
        {title: "نشيد أن تدخلني ربي الجنة", info: "د/ السيد جاد الله"}, {title: "الحساب الذهني", info: "أ/ أشرف عبد التواب"},
        {title: "دورة الماء في الطبيعة", info: "أ/ محمد حمدي"}, {title: "نشيد حان الرحيل", info: "أ/ أحمد الشربيني"},
        {title: "مسيرة التخرج", info: "طلاب الدفعة 34"}
    ];

    function updateDateTime() {
        const now = new Date();
        document.getElementById('date').textContent = now.toLocaleDateString('ar-SA', { weekday: 'long', month: 'short', day: 'numeric' });
        document.getElementById('time').textContent = now.toLocaleTimeString('ar-SA', { hour12: true });
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function render(steps, active) {
        const list = document.getElementById('list');
        list.innerHTML = "";
        steps.forEach((s, i) => {
            const id = i+1; const cls = id == active ? 'active' : '';
            list.innerHTML += `<div class="step ${cls}" id="s-${id}"><div class="num">${id}</div><div><h3 style="margin:0;font-size:0.9rem">${s.title}</h3><small style="color:#777">${s.info || ''}</small></div></div>`;
        });
        const el = document.getElementById('s-' + active);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // دالة ذكية لتجهيز الرابط النهائي لفتح تطبيق اليوتيوب مباشرة
    function fixYoutubeUrl(urlOrId) {
        if (!urlOrId) return "https://youtube.com";
        if (urlOrId.includes("youtube.com") || urlOrId.includes("youtu.be")) {
            return urlOrId.trim();
        }
        return "https://www.youtube.com/watch?v=" + urlOrId.trim();
    }

    async function sync() {
        try {
            const r = await fetch(db); const d = await r.json();
            if(d) {
                let stepsList = d.steps || defaultSteps;
                let active = d.currentStep || 1;
                render(stepsList, active);
                
                let rawVid = d.videoID || "";
                document.getElementById('liveLink').href = fixYoutubeUrl(rawVid);
            }
        } catch (e) { console.log("DB connection error"); }
    }

    render(defaultSteps, 1);
    sync();
    setInterval(sync, 2000); 
</script>
</body>
</html>
