<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم المطورة (19 فقرة) - أ/ محمد كمال</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .card { background: #fff; max-width: 950px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .box { background: #f8faff; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #d1e3ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; font-size: 0.95rem; }
        th { background-color: #1a73e8; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        input { width: 90%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9rem; box-sizing: border-box; }
        button { color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-stream { background: #d32f2f; width: 100%; }
        .btn-stream:hover { background: #b71c1c; }
        .btn-save { background: #28a745; padding: 12px 30px; font-size: 1.1rem; margin-top: 15px; }
        .btn-save:hover { background: #218838; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="color:#1a73e8">لوحة التحكم المطورة (19 فقرة) - أ/ محمد كمال</h2>
    <p style="color: #555;">يمكنك تعديل نصوص الفقرات وروابط اليوتيوب بالأسفل، ثم حفظها أو بث أي فقرة مباشرة لتظهر للجمهور.</p>

    <div class="box">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 25%;">عنوان الفقرة</th>
                    <th style="width: 25%;">المسؤول / إعداد</th>
                    <th style="width: 30%;">رابط أو كود فيديو اليوتيوب</th>
                    <th style="width: 15%;">البث المباشر</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>

        <button onclick="saveAllSteps()" class="btn-save">حفظ وتحديث بيانات الـ 19 فقرة 💾</button>
    </div>
</div>

<script>
    const db = "https://alabeer1447-default-rtdb.firebaseio.com/haldat.json";
    
    // مصفوفة النصوص والروابط الافتراضية المحدثة لـ 19 فقرة
    const defaults = [
        {title: "المقدمة والقرآن الكريم", info: "إعداد: أ/ إبراهيم", videoID: "6h5WAoDM68g"}, 
        {title: "كلمة وكيل المدرسة", info: "أ/ محمد بن عبد الله الزهراني", videoID: "6h5WAoDM68g"},
        {title: "النشيد الوطني", info: "طلاب المرحلة الأولية", videoID: "6h5WAoDM68g"}, 
        {title: "نشيد بلادي منار الهدى", info: "أ/ عماد خميس", videoID: "6h5WAoDM68g"},
        {title: "مسرحية أهمية العلم", info: "أ/ عنتر السيد", videoID: "6h5WAoDM68g"}, 
        {title: "نشيد أنا إنسان", info: "أ/ وليد جمعة", videoID: "6h5WAoDM68g"},
        {title: "صراع العلم والجهل", info: "أ/ أحمد رفعت", videoID: "6h5WAoDM68g"}, 
        {title: "نشيد خير الأنام", info: "أ/ حسن علام", videoID: "6h5WAoDM68g"},
        {title: "قصيدة مدارس العبير", info: "أ/ محمود محسن", videoID: "6h5WAoDM68g"}, 
        {title: "نشيد اللغة الإنجليزية", info: "أ/ محمود يحيى", videoID: "6h5WAoDM68g"},
        {title: "أوبريت يا أجمل المدارس", info: "أ/ محمد قدري", videoID: "6h5WAoDM68g"}, 
        {title: "مسرحية احترام المعلم", info: "أ/ حماده العجواني", videoID: "6h5WAoDM68g"},
        {title: "نشيد أن تدخلني ربي الجنة", info: "د/ السيد جاد الله", videoID: "6h5WAoDM68g"}, 
        {title: "الحساب الذهني", info: "أ/ أشرف عبد التواب", videoID: "6h5WAoDM68g"},
        {title: "دورة الماء في الطبيعة", info: "أ/ محمد حمدي", videoID: "6h5WAoDM68g"}, 
        {title: "نشيد حان الرحيل", info: "أ/ أحمد الشربيني", videoID: "6h5WAoDM68g"},
        {title: "مسيرة التخرج", info: "طلاب الدفعة 34", videoID: "6h5WAoDM68g"},
        {title: "فقرة إضافية 1", info: "إرساء مجهودات الطلاب", videoID: "6h5WAoDM68g"},
        {title: "فقرة إضافية 2", info: "خاتمة وتكريم", videoID: "6h5WAoDM68g"}
    ];

    const tbody = document.getElementById('table-body');
    const totalSteps = 19;
    
    function cleanVideoID(v) {
        v = v.trim();
        if (v.includes('v=')) return v.split('v=')[1].split('&')[0];
        if (v.includes('live/')) return v.split('live/')[1].split('?')[0];
        if (v.includes('youtu.be/')) return v.split('youtu.be/')[1].split('?')[0];
        return v;
    }

    async function loadData() {
        try {
            const r = await fetch(db);
            const d = await r.json();
            let steps = (d && d.steps && d.steps.length > 0) ? d.steps : defaults;

            tbody.innerHTML = "";
            for (let i = 0; i < totalSteps; i++) {
                const id = i + 1;
                // التأكد من جلب البيانات الموجودة في السيرفر أولاً، وإلا استخدام النص الافتراضي
                const s = steps[i] || defaults[i] || { title: "", info: "", videoID: "6h5WAoDM68g" };
                
                // حل مشكلة توافق المفاتيح القديمة (t, p, v) مع الجديدة (title, info, videoID) لضمان عدم ضياع أي رابط
                const titleText = s.title || s.t || "";
                const infoText = s.info || s.p || "";
                const currentVideo = s.videoID || s.v || "6h5WAoDM68g"; 
                
                tbody.innerHTML += `
                    <tr>
                        <td><b>${id}</b></td>
                        <td><input id="t-${id}" value="${titleText}"></td>
                        <td><input id="p-${id}" value="${infoText}"></td>
                        <td><input id="v-${id}" value="${currentVideo}" placeholder="رابط أو كود الفيديو"></td>
                        <td><button onclick="startLive(${id})" class="btn-stream">بث الآن 🎥</button></td>
                    </tr>
                `;
            }
        } catch (e) {
            console.log("خطأ في الاتصال، يتم عرض الجدول الافتراضي.");
        }
    }

    async function startLive(id) {
        const rawVid = document.getElementById(`v-${id}`).value;
        const cleanVid = cleanVideoID(rawVid);

        if(!cleanVid) {
            alert("يرجى وضع رابط أو كود فيديو صحيح لهذه الفقرة أولاً!");
            return;
        }

        try {
            await fetch(db, { 
                method: 'PATCH', 
                body: JSON.stringify({ currentStep: id, videoID: cleanVid }) 
            });
            alert(`🚀 تم إطلاق بث الفقرة (${id}) بنجاح!`);
        } catch (error) {
            alert("حدث خطأ أثناء إرسال أمر البث المباشر.");
        }
    }

    async function saveAllSteps() {
        let s = [];
        for(let i = 1; i <= totalSteps; i++) {
            const rawVid = document.getElementById(`v-${i}`).value;
            s.push({ 
                title: document.getElementById(`t-${i}`).value, 
                info: document.getElementById(`p-${i}`).value,
                videoID: cleanVideoID(rawVid)
            });
        }
        try {
            await fetch(db, { method: 'PATCH', body: JSON.stringify({ steps: s }) });
            alert(`تم حفظ وتحديث بيانات الـ 19 فقرة بنجاح في قاعدة البيانات 💾`);
        } catch (error) {
            alert("حدث خطأ أثناء حفظ الجدول.");
        }
    }

    loadData();
</script>
</body>
</html>
